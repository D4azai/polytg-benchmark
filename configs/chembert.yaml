experiment:
  name: chembert_fixed_embedding

data:
  input_path: data/raw/polytg.csv
  processed_path: data/processed/polytg_cleaned.csv
  smiles_column: smiles
  target_column: tg
  target_unit: kelvin
  aggregate_repeats: none

split:
  strategy: random
  seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

representation:
  name: chembert
  model_name: seyonec/ChemBERTa-zinc-base-v1
  revision: 761d6a18cf99db371e0b43baf3e2d21b3e865a20
  pooling: mean
  max_length: 256
  batch_size: 32
  device: auto
  cache_dir: data/processed/embeddings
  parameter_sets:
    chembert:
      model_name: seyonec/ChemBERTa-zinc-base-v1
      revision: 761d6a18cf99db371e0b43baf3e2d21b3e865a20
      pooling: mean
      max_length: 256
      batch_size: 32
      device: auto
      cache_dir: data/processed/embeddings

model:
  name: ridge
  parameters:
    alpha: 1.0
  parameter_sets:
    ridge:
      alpha: 1.0
    elastic_net:
      alpha: 0.01
      l1_ratio: 0.5
      max_iter: 10000
    random_forest:
      n_estimators: 500
      min_samples_leaf: 1
      n_jobs: -1
    xgboost:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 6
      n_jobs: 1
    mlp:
      hidden_layer_sizes: [256, 128]
      alpha: 0.0001
      learning_rate_init: 0.001
      max_iter: 500
      early_stopping: true
      validation_fraction: 0.15
      n_iter_no_change: 30

training:
  seed: 42

benchmark:
  representations: [chembert]
  models: [ridge, elastic_net, random_forest, xgboost, mlp]
  split_strategies: [random, scaffold]
  seeds: [42, 1337, 2027]

outputs:
  raw_dir: results/raw
  figures_dir: results/figures
  benchmark_file: results/benchmark_results.csv
