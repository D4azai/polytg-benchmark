experiment:
  name: ecfp_baseline

data:
  input_path: data/raw/polytg.csv
  processed_path: data/processed/polytg_cleaned.csv
  smiles_column: smiles
  target_column: tg
  target_unit: kelvin
  aggregate_repeats: none

split:
  strategy: random
  seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

representation:
  name: ecfp
  radius: 2
  n_bits: 2048
  include_chirality: false
  use_bond_types: true

model:
  name: random_forest
  parameters:
    n_estimators: 500
    min_samples_leaf: 1
    n_jobs: -1
  parameter_sets:
    random_forest:
      n_estimators: 500
      min_samples_leaf: 1
      n_jobs: -1
    xgboost:
      n_estimators: 500
      learning_rate: 0.05
      max_depth: 6
      subsample: 1.0
      colsample_bytree: 1.0
      n_jobs: 1

training:
  seed: 42

outputs:
  raw_dir: results/raw
  figures_dir: results/figures
  benchmark_file: results/benchmark_results.csv

