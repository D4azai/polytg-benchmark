[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polytg-benchmark"
version = "0.1.0"
description = "Benchmarking molecular representations for polymer glass-transition temperature prediction"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "PolyTg-Bench contributors" }]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "rdkit>=2023.9.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "tabulate>=0.9",
  "tqdm>=4.66",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
graph = ["torch>=2.2", "torch-geometric>=2.5"]
language = ["torch>=2.2", "transformers>=4.40"]
all = [
  "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6",
  "torch>=2.2", "torch-geometric>=2.5", "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
